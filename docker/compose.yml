services:
  postgres:
    image: postgres:17-alpine3.20
    environment:
      POSTGRES_USER: omi
      POSTGRES_PASSWORD: omi
      POSTGRES_DB: omi
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data
